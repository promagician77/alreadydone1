<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>iOS Lock Screen - Already Done Notification</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Outfit', sans-serif;
    background: #1a1a1a;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 20px;
  }

  /* iPhone Frame */
  .iphone {
    width: 390px;
    height: 844px;
    background: linear-gradient(135deg, #1e3a5f 0%, #2d1b3d 100%);
    border-radius: 55px;
    position: relative;
    overflow: hidden;
    box-shadow: 0 30px 90px rgba(0,0,0,0.5),
                inset 0 0 0 12px #000,
                inset 0 0 0 14px #1a1a1a;
  }

  /* Dynamic Island */
  .dynamic-island {
    position: absolute;
    top: 24px;
    left: 50%;
    transform: translateX(-50%);
    width: 120px;
    height: 37px;
    background: #000;
    border-radius: 24px;
    z-index: 1000;
  }

  /* Lock Screen Content */
  .lock-screen {
    width: 100%;
    height: 100%;
    position: relative;
    color: white;
    display: flex;
    flex-direction: column;
  }

  /* Status Bar */
  .status-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 65px 28px 0;
    font-size: 15px;
    font-weight: 600;
    z-index: 10;
  }

  .time {
    font-size: 15px;
    font-weight: 600;
  }

  .status-icons {
    display: flex;
    gap: 6px;
    align-items: center;
    font-size: 16px;
  }

  /* Clock */
  .clock {
    text-align: center;
    padding: 120px 0 0;
  }

  .clock-time {
    font-size: 88px;
    font-weight: 300;
    line-height: 1;
    letter-spacing: -2px;
    margin-bottom: 8px;
    text-shadow: 0 2px 20px rgba(0,0,0,0.3);
  }

  .clock-date {
    font-size: 20px;
    font-weight: 500;
    opacity: 0.9;
  }

  /* Notification Area */
  .notifications {
    padding: 40px 16px;
    flex: 1;
  }

  /* iOS Notification Card */
  .notification-card {
    background: rgba(255, 255, 255, 0.85);
    backdrop-filter: blur(40px) saturate(180%);
    border-radius: 24px;
    padding: 16px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.3);
    animation: slideDown 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94);
    margin-bottom: 12px;
  }

  @keyframes slideDown {
    from {
      transform: translateY(-20px);
      opacity: 0;
    }
    to {
      transform: translateY(0);
      opacity: 1;
    }
  }

  /* Notification Header */
  .notification-header {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 10px;
  }

  .app-icon {
    width: 28px;
    height: 28px;
    background: linear-gradient(135deg, #B8861E 0%, #8B6914 100%);
    border-radius: 7px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    flex-shrink: 0;
    box-shadow: 0 2px 8px rgba(184, 134, 30, 0.3);
  }

  .notification-app-info {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .app-name {
    font-size: 14px;
    font-weight: 600;
    color: #1d1d1f;
    letter-spacing: -0.2px;
  }

  .notification-time {
    font-size: 13px;
    color: #8e8e93;
    font-weight: 400;
  }

  /* Notification Content */
  .notification-content {
    padding-left: 0;
  }

  .notification-title {
    font-size: 15px;
    font-weight: 600;
    color: #1d1d1f;
    line-height: 1.3;
    margin-bottom: 4px;
    letter-spacing: -0.3px;
  }

  .notification-body {
    font-size: 15px;
    font-weight: 400;
    color: #1d1d1f;
    line-height: 1.35;
    letter-spacing: -0.2px;
  }

  /* Notification Actions */
  .notification-actions {
    display: flex;
    gap: 8px;
    margin-top: 12px;
    padding-top: 12px;
    border-top: 0.5px solid rgba(0,0,0,0.08);
  }

  .notification-action {
    flex: 1;
    padding: 10px;
    background: rgba(255, 255, 255, 0.5);
    backdrop-filter: blur(10px);
    border: 0.5px solid rgba(0,0,0,0.08);
    border-radius: 12px;
    font-size: 15px;
    font-weight: 600;
    color: #007AFF;
    text-align: center;
    cursor: pointer;
    transition: all 0.2s ease;
  }

  .notification-action:active {
    background: rgba(255, 255, 255, 0.7);
    transform: scale(0.97);
  }

  .notification-action.primary {
    background: #007AFF;
    color: white;
    border: none;
  }

  .notification-action.primary:active {
    background: #0051D5;
  }

  /* Bottom Bar */
  .lock-screen-bottom {
    padding: 0 28px 34px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .flashlight, .camera {
    width: 50px;
    height: 50px;
    background: rgba(255, 255, 255, 0.2);
    backdrop-filter: blur(20px);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
  }

  .swipe-indicator {
    position: absolute;
    bottom: 8px;
    left: 50%;
    transform: translateX(-50%);
    width: 140px;
    height: 5px;
    background: rgba(255, 255, 255, 0.4);
    border-radius: 3px;
  }

  /* Demo Controls */
  .demo-controls {
    position: fixed;
    top: 20px;
    left: 20px;
    background: rgba(0,0,0,0.9);
    backdrop-filter: blur(20px);
    padding: 20px;
    border-radius: 16px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.5);
    z-index: 2000;
    color: white;
  }

  .demo-controls h3 {
    font-size: 16px;
    margin-bottom: 12px;
    font-weight: 600;
  }

  .demo-controls button {
    display: block;
    width: 100%;
    padding: 10px 16px;
    background: #007AFF;
    color: white;
    border: none;
    border-radius: 8px;
    font-family: -apple-system, sans-serif;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s ease;
  }

  .demo-controls button:hover {
    background: #0051D5;
  }

  .demo-controls button:active {
    transform: scale(0.97);
  }

  .demo-note {
    margin-top: 12px;
    font-size: 12px;
    color: #8e8e93;
    line-height: 1.4;
  }
</style>
</head>
<body>

<!-- Demo Controls -->
<div class="demo-controls">
  <h3>iOS Lock Screen</h3>
  <button onclick="showNotification()">Show Notification</button>
  <div class="demo-note">
    This is how your "Already Done" notification will appear on a user's iPhone lock screen.
  </div>
</div>

<!-- iPhone -->
<div class="iphone">
  
  <!-- Dynamic Island -->
  <div class="dynamic-island"></div>
  
  <!-- Lock Screen -->
  <div class="lock-screen">
    
    <!-- Status Bar -->
    <div class="status-bar">
      <div class="time">7:00</div>
      <div class="status-icons">
        <span>📶</span>
        <span>📡</span>
        <span>🔋</span>
      </div>
    </div>
    
    <!-- Clock -->
    <div class="clock">
      <div class="clock-time">7:00</div>
      <div class="clock-date">Tuesday, May 13</div>
    </div>
    
    <!-- Notifications -->
    <div class="notifications">
      
      <!-- Already Done Notification -->
      <div class="notification-card" id="notification" style="display: none;">
        <div class="notification-header">
          <div class="app-icon">✓</div>
          <div class="notification-app-info">
            <div class="app-name">ALREADY DONE</div>
            <div class="notification-time">now</div>
          </div>
        </div>
        
        <div class="notification-content">
          <div class="notification-title">
            Are You Ready for the New Best Day Ever?
          </div>
          <div class="notification-body">
            It's time to create your new daily manifestation story!
          </div>
        </div>
        
        <div class="notification-actions">
          <button class="notification-action" onclick="laterAction()">Later</button>
          <button class="notification-action primary" onclick="createAction()">Create Story</button>
        </div>
      </div>
      
    </div>
    
    <!-- Bottom Bar -->
    <div class="lock-screen-bottom">
      <div class="flashlight">🔦</div>
      <div class="camera">📷</div>
    </div>
    
    <!-- Swipe Indicator -->
    <div class="swipe-indicator"></div>
    
  </div>
  
</div>

<script>
  function showNotification() {
    const notification = document.getElementById('notification');
    notification.style.display = 'block';
    notification.style.animation = 'none';
    setTimeout(() => {
      notification.style.animation = 'slideDown 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94)';
    }, 10);
  }

  function createAction() {
    alert('Opening Already Done app to create story...');
    // In real implementation, this opens the app
  }

  function laterAction() {
    const notification = document.getElementById('notification');
    notification.style.opacity = '0';
    notification.style.transform = 'scale(0.95)';
    notification.style.transition = 'all 0.3s ease';
    setTimeout(() => {
      notification.style.display = 'none';
      notification.style.opacity = '1';
      notification.style.transform = 'scale(1)';
    }, 300);
  }

  // Auto-show notification after 1 second
  setTimeout(() => {
    showNotification();
  }, 1000);
</script>

</body>
</html>
